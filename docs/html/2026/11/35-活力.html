				<p>活力はどうすれば生じるのか。</p>
				<p>――目の前にしたときに。</p>
				<p>活力はどうして生じるのか。</p>
				<p>――生成流転を目指して。</p>
				<p>化育と成育。</p>
				<div class="wave-line"></div>
				<p>かえり咲きなど期待できるものだろうか。発散など期待できるものだろうか。皮膚は多層にわたって繰り広げられ、異物を外に排出する。幾重にも積み重なり、幾度も作り変えられる。見た目にはわからずとも新陳代謝が行われ、再度古さが回帰する。引き継ぎは、繋ぎ目に任されるのだろうか。そこには途方もない引力が働くか。新しさと古さ、移動の自由によって、垣根が新しい様相を帯びてくる。</p>
