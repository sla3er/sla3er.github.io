					<p>高望みの渦中に。</p>
				</div>
				<h2 class="section-title">目覚め</h2>
				<p>時間を潰す。時間を眺める。時間を浸す。</p>
				<p>夕暮れ時に思うために、朝方に忸怩するために。</p>
				<p>何ものかになろうと欲する私の根性。何ものかになりたいと思案する私の性根。</p>
				<p>内奥を形成する外部刺戟、内奥に繁茂する外部環境。</p>
				<p>ここから遠くにいけるかしら？</p>
				<p>ここから離れていきていけるかしら？</p>
				<p>どこにいってもやっていけるかしら？</p>
				<p>必要なものは調達できるかしら？</p>
				<p>どこぞの奴になるのかしら。</p>
				<p>ありえないだろう星となろうか、この能力の閾値、限界から。</p>
