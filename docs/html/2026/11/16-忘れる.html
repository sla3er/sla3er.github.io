				<h2 class="section-title">姿が現われる</h2>
				<p>自分を忘れて、自分から離れて、自分を置いてけぼりにして、自分を取り戻そうと右往左往。そんなことは傲慢で、自分というものの檻に牢獄に自ら入らんとする奴隷の心情であって。</p>
				<p>身姿がイメージされるのに時間が必要で、許しの時間、受容の時間と同時に発露の時間、ここにはいないがそこにはいて、共有地がなくとも、世界を俯瞰して。運ばれるために、そこまで動いて、運ぶためにそこまで動かして。重さに耐えかねて尻餅をついても、諦念によって眺めることになっても、われを捨て、連綿のなかの一糸を紡ぐものに捧ぐ。記憶、ほつれた糸。</p>
