					<p>知的好奇心などという浮かればなし。</p>
				</div>
				<h2 class="section-title">とこに</h2>
				<p>いかれているのか？　いいえ、いかれるほどに逞しくない。</p>
				<p>自分の関心事から外れた物事の数数というよりも、表層理解にすら到達できない浮遊。</p>
				<p>物質として捉える物事の一様性、魔術的思考。そこに揺らぎ、揺蕩う中で、Ουροβοροσの努が起こる。</p>
				<p>呆れかえられても仕方がない。内に沈むと思えば、他愛もない眼底から急所へと向う線が引かれる。そんな時は、外へと向かうのも憂鬱で、休みといえども休まらず、上を見遣ることによって、時間を眺めるに至る。</p>
				<p>然りというべきか。</p>
