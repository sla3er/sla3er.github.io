				<h2 class="section-title">音叉</h2>
				<p>滾るか我が肉体よ、乗り超えるかこの死を、歩むかこの道の先を、跳べるか崖ともわからぬこの堺を。</p>
				<p>精神よ、わが鉛よ、あろうことか此時なのだ。運命、これが愛であるか。知らぬか、この肉体を、この難儀を。やってくるのだ空腹が。あらん限り、果たせ、あろう事も、なき事も。波は掴むのだ、押し寄せて。ここで打ち止めにしようか。</p>
