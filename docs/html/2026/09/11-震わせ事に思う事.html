		<article class="article">
			<div class="header">
				<h1 class="title"><ruby>震<rt>ふる</rt></ruby>わせ<ruby>事<rt>ごと</rt></ruby>に<ruby>思<rt>おも</rt></ruby>う<ruby>事<rt>こと</rt></ruby></h1>
				<div class="author emoji-gruv">手</div>
				<div class="date"><time datetime="2026-09-11">2026.09.11</time></div>
			</div>
			<div class="indent">
				<div class="abstract">
					<p>幸いにして、ここまでいく。</p>
				</div>
				<h2 class="section-title">といかけ</h2>
				<p>我の中にも我の創作が生じているように他者の中にも他者の創作が生じている。</p>
				<p>限りのある世界において、そこまでいくのにいくばくか。</p>
				<p>よかれとわるかれと思うのは後ほどで。</p>
				<p>あらん限り、そこまで行くことを目的に据えて。</p>
				<p>ことの次第はこれまで通りなのかもしれない。</p>
				<p>どうりでこれ見よがしなのだ。</p>
				<p>筋トレは幼児退行の一種として。</p>
				<div class="poem">
					<div class="poem-title">はつ</div>
					<p>はじめに機械があった。その機会とともに、人は解剖をはじめた。</p>
					<p>情緒的ゆとりはその後にうまれた。</p>
					<p>生物は機械であった。</p>
				</div>
			</div>
