				<h2 class="section-title">うずまき</h2>
				<p>確とした物語の不在。否、やり通したという経験の不在、（たとえそれがあったとしても……それも同様にして物語として回収される）。かえって何もないと感じる一つの所以。</p>
				<p>忍耐の持続力の微微たるもの。</p>
				<p>予感に棲まうずる賢さ。</p>
				<p>書き換えられない交流の産物、意味付けの書き換え。蓄積される情報という記憶の深海。</p>
				<p>他者を支配するのではなく、他者を共感媒体とするのではなく、「他者を手段としてのみならず同時に目的として扱え」（カント）。</p>
